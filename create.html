<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StaIns.createnewaccount.com</title>
</head>
<body id="create">
  
  <image id="crt" src="stains.png"></image>
  <h1 id="tm">StaIns</h1>
  <a id="bck" href="index.html">⬅️</a>
  
  <br><br><br><br>

  <img
        id="pfps"
        src="default-profile.png"
        alt="Profile Picture"
      >

  <input
    type="file"
    id="picInput"
    accept="image/*"
    style="display:none;"
  >

  <button id="edit">✏️</button>
  
  <p>*First name</p>
  <input type="text" placeholder="first name" id="firstname">
  
  <p>*Middle name</p>
  <input type="text" placeholder="middle name" id="middlename">
  
  <p>*Surname</p>
  <input type="text" placeholder="surname" id="surname">
  
  <p>*Password</p>
  <input type="password" id="ct" placeholder="🔒 create your password">
  <button id="ctt">🙉</button>
  
  <p>*Confirm password</p>
  <input type="password" id="ct2" placeholder="🔒 confirm your password">
  <button id="ctt2">🙉</button>
  
  <p>*Email address</p>
  <input type="text" placeholder="✉️ email" id="email">
  
  <p>*Mobile number</p>
  <input type="text" placeholder="mobile number" id="mobile">
  
  <br><br>
  
  <button id="btn3">Create</button>
  
  <script type="module" src="create.js"></script>
</body>
</html>
